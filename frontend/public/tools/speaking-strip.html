<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الشريط الناطق · مقام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070707; --panel:#0d0d0c; --panel-2:#121210;
  --gold:#D4AF37; --gold-dim:#8a7128; --gold-ghost:rgba(212,175,55,.14);
  --live:#ff3d81; --lcd:#4ade80;
  --dot:#2f9be8; --dot-on:#7fd0ff; --dot-off:#16283a;
  --strip:#ffd633; --strip-ink:#171207;
  --speak:rgba(212,175,55,.20); --speak-edge:rgba(212,175,55,.55);
  --queue:rgba(160,32,58,.26); --queue-edge:rgba(255,61,129,.45);
  --ink:#e9e4d6; --ink-dim:#8d887a; --line:#26241d;
  --bevel:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Cairo',sans-serif}
body{
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px);
  padding:22px 14px 60px;
}
.wrap{max-width:1240px;margin:0 auto}

.masthead{text-align:center;padding:10px 0 22px;border-bottom:1px solid var(--line);margin-bottom:22px}
.masthead h1{font-family:'Amiri',serif;font-weight:700;font-size:38px;color:var(--gold);margin:0;letter-spacing:.02em}
.masthead .sub{font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-dim);letter-spacing:.28em;margin-top:6px}

.bevel{clip-path:polygon(var(--bevel) 0,100% 0,100% calc(100% - var(--bevel)),calc(100% - var(--bevel)) 100%,0 100%,0 var(--bevel))}

.console{background:var(--panel);border:1px solid var(--line);padding:16px;margin-bottom:20px}
.console-grid{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;min-width:120px}
.field label{font-family:'Space Mono',monospace;font-size:10px;color:var(--ink-dim);letter-spacing:.16em}
.field .val{font-family:'Space Mono',monospace;font-size:20px;color:var(--lcd);font-weight:700;line-height:1}
input[type=range]{accent-color:var(--gold);width:170px;background:transparent}
select,input[type=text]{
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  font-family:'Cairo',sans-serif;font-size:14px;padding:9px 11px;outline:none
}
select:focus,input[type=text]:focus{border-color:var(--gold-dim)}
.text-field{flex:1 1 340px}
.text-field input{width:100%;font-family:'Amiri',serif;font-size:19px}
.btn{
  background:transparent;border:1px solid var(--gold-dim);color:var(--gold);
  font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.12em;
  padding:11px 20px;cursor:pointer;transition:.16s
}
.btn:hover{background:var(--gold-ghost)}
.btn.primary{border-color:var(--gold);background:var(--gold-ghost)}
.btn.live{border-color:var(--live);color:var(--live);background:rgba(255,61,129,.1)}
.toggle{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-dim);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--gold);width:15px;height:15px;cursor:pointer}

.warn{
  margin:12px 0 0;padding:9px 13px;border-right:3px solid var(--live);
  background:rgba(255,61,129,.07);color:#ffb3cd;font-size:13px;display:none
}
.warn.show{display:block}

.stage{background:var(--panel);border:1px solid var(--line);padding:20px 16px;overflow-x:auto}
.bar-row{
  display:grid;position:relative;
  grid-template-rows:28px 40px 44px 24px;
  align-items:center;margin-bottom:22px;min-width:760px
}
.bar-row:last-child{margin-bottom:0}

.zone{
  grid-row:1 / -1;z-index:0;border-radius:3px;
  transition:background .13s linear,box-shadow .13s linear;
  background:transparent;pointer-events:none
}
.zone.queued{background:var(--queue);box-shadow:inset 0 0 0 1px var(--queue-edge)}
.zone.speaking{background:var(--speak);box-shadow:inset 0 0 0 1px var(--speak-edge)}
@keyframes wordPulse{0%{background:rgba(212,175,55,.46)}100%{background:var(--speak)}}
.zone.speaking.pulse{animation:wordPulse .22s ease-out}

.brk{grid-row:1;z-index:1;position:relative;height:12px;align-self:end;
  border-top:1.5px solid var(--gold-dim);border-inline-start:1.5px solid var(--gold-dim);
  border-inline-end:1.5px solid var(--gold-dim);margin:0 5px;transition:border-color .13s}
.brk.speaking{border-color:var(--gold)}
.brk-n{position:absolute;top:-17px;inset-inline-start:50%;transform:translateX(50%);
  font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--gold-dim);transition:color .13s}
.brk.speaking .brk-n{color:var(--gold)}
.brk.cont-start{border-inline-start:none}
.brk.cont-end{border-inline-end:none}

.dotcell{grid-row:2;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px}
.tri{width:0;height:0;border-inline-start:6px solid transparent;border-inline-end:6px solid transparent;
  border-top:9px solid var(--dot);opacity:.85;transition:.13s}
.tri.blank{border-top-color:transparent}
.dotcell.on .tri{border-top-color:var(--dot-on);opacity:1}
.dot{width:15px;height:15px;border-radius:50%;background:var(--dot-off);
  border:1.5px solid #24384a;transition:.13s}
.dot.hit{background:var(--dot);border-color:var(--dot-on)}
.dotcell.on .dot{background:var(--dot-on);border-color:#fff;transform:scale(1.22);
  box-shadow:0 0 12px rgba(127,208,255,.75)}
.dotcell.lead .dot{border-color:var(--gold);box-shadow:0 0 9px rgba(212,175,55,.6)}

.striprow{grid-row:3;z-index:1;position:relative;display:flex;align-items:center;justify-content:center;
  height:36px;background:var(--strip);color:var(--strip-ink);transition:.13s}
.striprow.empty{background:rgba(255,214,51,.12)}
.striprow .syl{font-family:'Amiri',serif;font-size:19px;font-weight:700;line-height:1;padding:0 2px;white-space:nowrap}
.striprow.on{background:#fff6c2;box-shadow:0 0 0 2px var(--gold),0 0 16px rgba(212,175,55,.5);z-index:2}
.striprow.inword{background:#ffe680}
.hy{position:absolute;inset-inline-start:-4px;top:50%;transform:translateY(-50%);
  font-family:'Amiri',serif;font-size:16px;color:rgba(23,18,7,.55);z-index:3}

.cnt{grid-row:4;z-index:1;text-align:center;font-family:'Space Mono',monospace;font-size:12px;color:#6b6252}
.cnt.beat{color:var(--gold);font-weight:700;font-size:14px}
.cnt.pickup{color:var(--gold-dim)}

.rowtag{position:absolute;top:-4px;inset-inline-end:0;transform:translateY(-100%);
  font-family:'Space Mono',monospace;font-size:10px;color:var(--ink-dim);letter-spacing:.16em}

.legend{display:flex;flex-wrap:wrap;gap:20px;margin-top:22px;padding-top:16px;
  border-top:1px solid var(--line);font-size:12px;color:var(--ink-dim)}
.legend i{display:inline-block;width:13px;height:13px;vertical-align:-2px;margin-inline-end:6px;border-radius:2px}

.readouts{display:flex;flex-wrap:wrap;gap:26px;margin-top:18px;padding:14px 16px;
  background:var(--panel-2);border:1px solid var(--line);font-family:'Space Mono',monospace;font-size:12px}
.readouts b{color:var(--lcd);font-size:16px;display:block;margin-top:3px}
.readouts span{color:var(--ink-dim);letter-spacing:.12em}

pre.json{display:none;margin-top:16px;padding:14px;background:#050505;border:1px solid var(--line);
  color:#9fdcc2;font-family:'Space Mono',monospace;font-size:11px;line-height:1.65;
  max-height:400px;overflow:auto;direction:ltr;text-align:left}
pre.json.show{display:block}
footer{text-align:center;margin-top:34px;font-family:'Space Mono',monospace;
  font-size:10px;color:#3d3a32;letter-spacing:.28em}
</style>
</head>
<body>
<div class="wrap">

<div class="masthead">
  <h1>الشريط الناطق</h1>
  <div class="sub">MAQAM · SPEAKING STRIP · 1 SYLLABLE = 1 PULSE</div>
</div>

<div class="console bevel">
  <div class="console-grid">
    <div class="field text-field">
      <label>البار — نص عربي مُشكَّل بالكامل</label>
      <input type="text" id="txt" value="جاءَتْ جُمْلَتِي زَلْزَلَةْ صَوْتُها الْعَمِيقُ زادْ">
    </div>
    <div class="field">
      <label>BPM</label>
      <div class="val" id="bpmVal">90</div>
      <input type="range" id="bpm" min="40" max="200" value="90">
    </div>
    <div class="field">
      <label>التقسيمة</label>
      <select id="subdiv">
        <option value="4">مستقيمة — ١٦</option>
        <option value="3">ثلاثية — ١٢</option>
      </select>
    </div>
    <div class="field">
      <label>خيارات</label>
      <label class="toggle"><input type="checkbox" id="pickup"> خلية السَّبق</label>
      <label class="toggle"><input type="checkbox" id="loop" checked> تكرار</label>
    </div>
    <div class="field">
      <label>النقل</label>
      <button class="btn primary" id="play">▶ تشغيل</button>
    </div>
    <div class="field">
      <label>البيانات</label>
      <button class="btn" id="jsonBtn">JSON</button>
    </div>
  </div>
  <div class="warn" id="warn"></div>
</div>

<div class="stage bevel" id="stage"></div>

<div class="readouts bevel">
  <div><span>المقاطع</span><b id="rSyl">0</b></div>
  <div><span>الكلمات</span><b id="rWord">0</b></div>
  <div><span>البارات</span><b id="rBar">0</b></div>
  <div><span>مدة الخانة</span><b id="rSlot">0 ms</b></div>
  <div><span>مدة البار</span><b id="rBarMs">0 ms</b></div>
  <div><span>الكلمة الناطقة</span><b id="rNow">—</b></div>
</div>

<div class="legend">
  <div><i style="background:var(--dot)"></i> مقطع مَنطوق</div>
  <div><i style="background:var(--strip)"></i> الشريط الناطق</div>
  <div><i style="background:var(--speak);box-shadow:inset 0 0 0 1px var(--speak-edge)"></i> الكلمة الناطقة الآن</div>
  <div><i style="background:var(--queue);box-shadow:inset 0 0 0 1px var(--queue-edge)"></i> الكلمة المتأهبة</div>
  <div><i style="border-top:9px solid var(--dot);width:0;height:0;border-inline-start:6px solid transparent;border-inline-end:6px solid transparent;border-radius:0"></i> نَبر — مطلع الكلمة</div>
  <div>⌐ قوس الكلمة = عدد مقاطعها</div>
</div>

<pre class="json" id="json"></pre>

<footer>MAQAM · SPEAKING STRIP · READ RIGHT → LEFT</footer>
</div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════
   §1 — محرك التقطيع العروضي (Prosodic Syllabification Engine)
   العقد: نص عربي مُشكَّل → مصفوفة مقاطع لفظية موسومة بأوزانها
   ═══════════════════════════════════════════════════════════════ */
const AR = {
  FATHA:'\u064E', DAMMA:'\u064F', KASRA:'\u0650', SUKUN:'\u0652', SHADDA:'\u0651',
  FATHATAN:'\u064B', DAMMATAN:'\u064C', KASRATAN:'\u064D',
  ALEF:'\u0627', WAW:'\u0648', YA:'\u064A', MAKSURA:'\u0649', MADDA:'\u0622',
  HAMZA_ABOVE:'\u0623', HAMZA_BELOW:'\u0625', WASLA:'\u0671',
  TA_MARBUTA:'\u0629', HA:'\u0647', NOON:'\u0646', TATWEEL:'\u0640'
};
const SHORT_V = [AR.FATHA, AR.DAMMA, AR.KASRA];
const LETTER = /[\u0621-\u063A\u0641-\u064A\u0671\u0629]/;

function normalizeWord(w){
  let s = w;
  s = s.split(AR.TATWEEL).join('');
  s = s.split(AR.MADDA).join(AR.HAMZA_ABOVE + AR.FATHA + AR.ALEF);
  s = s.split(AR.WASLA).join(AR.ALEF);
  s = s.split(AR.MAKSURA).join(AR.ALEF);
  s = s.split(AR.TA_MARBUTA).join(AR.HA);
  s = s.split(AR.FATHATAN).join(AR.FATHA + AR.NOON + AR.SUKUN);
  s = s.split(AR.DAMMATAN).join(AR.DAMMA + AR.NOON + AR.SUKUN);
  s = s.split(AR.KASRATAN).join(AR.KASRA + AR.NOON + AR.SUKUN);
  let out = '';
  for (const ch of s){
    if (ch === AR.SHADDA){
      let k = out.length - 1;
      while (k >= 0 && !LETTER.test(out[k])) k--;
      if (k >= 0){
        const L = out[k], tail = out.slice(k + 1);
        out = out.slice(0, k) + L + AR.SUKUN + L + tail;
      }
    } else out += ch;
  }
  return out;
}

function tokenize(s){
  const units = [];
  for (const ch of s){
    if (LETTER.test(ch)) units.push({ c: ch, h: null });
    else if (SHORT_V.indexOf(ch) > -1 || ch === AR.SUKUN){
      if (units.length) units[units.length - 1].h = ch;
    }
  }
  return units;
}

function isMadd(unit, vowel){
  if (!unit || unit.h !== null) return false;
  if (vowel === AR.FATHA && unit.c === AR.ALEF) return true;
  if (vowel === AR.DAMMA && unit.c === AR.WAW)  return true;
  if (vowel === AR.KASRA && unit.c === AR.YA)   return true;
  return false;
}

const WEIGHT = { CV:'\u25CF', CVV:'\u25CF\u25AC', CVC:'\u25CF\u25AC',
                 CVVC:'\u25CF\u25AC\u25AC', CVCC:'\u25CF\u25AC\u25AC' };

function renderUnits(parts){
  return parts.map(function(p){ return p.c + (p.h ? p.h : ''); }).join('');
}

/** يقطّع كلمة واحدة إلى مقاطع لفظية. يعيد {syls, ambiguous} */
function syllabifyWord(word){
  const units = tokenize(normalizeWord(word));
  const syls = [];
  let ambiguous = false;
  if (!units.length) return { syls: syls, ambiguous: false };

  if (units[0].h === null){
    units[0].h = (units[0].c === AR.HAMZA_BELOW) ? AR.KASRA : AR.FATHA;
  }

  let i = 0, guard = 0;
  while (i < units.length && guard++ < 400){
    const u = units[i];

    if (u.h && SHORT_V.indexOf(u.h) > -1){
      const parts = [u];
      let type = 'CV', j = i + 1;

      if (isMadd(units[j], u.h)){ parts.push(units[j]); type = 'CVV'; j++; }

      if (j < units.length && units[j].h === AR.SUKUN){
        parts.push(units[j]); type += 'C'; j++;
        if (j === units.length - 1 && units[j].h === AR.SUKUN && type === 'CVC'){
          parts.push(units[j]); type = 'CVCC'; j++;
        }
      }
      syls.push({ text: renderUnits(parts), type: type, weight: WEIGHT[type] || WEIGHT.CV });
      i = j;

    } else if (u.h === AR.SUKUN){
      if (syls.length){
        const last = syls[syls.length - 1];
        last.text += u.c + AR.SUKUN;
        last.type += 'C';
        last.weight = WEIGHT[last.type] || last.weight;
      } else ambiguous = true;
      i++;

    } else if (i === units.length - 1){
      u.h = AR.SUKUN;
    } else if (units[i + 1] && units[i + 1].h === null && units[i + 1].c === AR.ALEF){
      u.h = AR.FATHA;
    } else if (units[i + 1] && units[i + 1].h === null && units[i + 1].c === AR.WAW){
      ambiguous = true; u.h = AR.DAMMA;
    } else if (units[i + 1] && units[i + 1].h === null && units[i + 1].c === AR.YA){
      ambiguous = true; u.h = AR.KASRA;
    } else {
      ambiguous = true;
      u.h = AR.FATHA;
    }
  }
  return { syls: syls, ambiguous: ambiguous };
}

/** يقطّع سطرًا كاملاً → {words:[{text,syls:[]}], flat:[], ambiguous} */
function analyzeLine(line){
  const raw = line.trim().split(/\s+/).filter(Boolean);
  const words = [], flat = [];
  let ambiguous = false;
  raw.forEach(function(w, wi){
    const r = syllabifyWord(w);
    if (r.ambiguous) ambiguous = true;
    if (!r.syls.length) return;
    const entry = { id: words.length, text: w, syls: r.syls };
    r.syls.forEach(function(s, si){
      flat.push({ text: s.text, type: s.type, weight: s.weight,
                  wordId: entry.id, word: w, idxInWord: si,
                  isOnset: si === 0, isCoda: si === r.syls.length - 1 });
    });
    words.push(entry);
  });
  return { words: words, flat: flat, ambiguous: ambiguous };
}

/* ═══════════════════════════════════════════════════════════════
   §2 — مُخطِّط الشبكة (Grid Mapper)   ١ مقطع = ١ خانة = ١ نبضة
   ═══════════════════════════════════════════════════════════════ */
const AR_NUM = { 1:'\u0661', 2:'\u0662', 3:'\u0663', 4:'\u0664' };
const SUB_STRAIGHT = ['', '\u0625\u064A', '\u0648', '\u0622'];
const SUB_TRIPLET  = ['', '\u062A\u0631\u0650\u0628', '\u0644\u0650\u062A'];

function buildGrid(count, subdiv, pickup){
  const perBar = 4 * subdiv;
  const cols   = perBar + (pickup ? 1 : 0);
  const need   = Math.max(count, 1);
  const usable = pickup ? need - 1 : need;
  const bars   = Math.max(1, Math.ceil(Math.max(usable, 1) / perBar));
  const total  = (pickup ? 1 : 0) + bars * perBar;

  const slots = [];
  let g = 0;
  if (pickup) slots.push({ g: g++, row: 0, col: 0, pickup: true, label: '\u0622' });
  for (let b = 0; b < bars; b++){
    for (let p = 0; p < perBar; p++){
      const beat = Math.floor(p / subdiv) + 1, sub = p % subdiv;
      const tbl  = subdiv === 3 ? SUB_TRIPLET : SUB_STRAIGHT;
      slots.push({ g: g++, row: b, col: (pickup ? 1 : 0) + p, pickup: false,
                   beat: beat, sub: sub,
                   label: sub === 0 ? AR_NUM[beat] : tbl[sub] });
    }
  }
  return { slots: slots, cols: cols, bars: bars, perBar: perBar, total: total };
}

/* ═══════════════════════════════════════════════════════════════
   §3 — بانِي الجدول الزمني (Timeline Builder)
   slotDur = 60 / BPM / subdiv   —  توقيتات مطلقة، بلا انجراف
   ═══════════════════════════════════════════════════════════════ */
function buildTimeline(flat, grid, bpm, subdiv){
  const slotSec = 60 / bpm / subdiv;
  const tl = [];
  flat.forEach(function(s, i){
    const slot = grid.slots[i];
    if (!slot) return;
    tl.push({
      index: i, syllable: s.text, type: s.type, weight: s.weight,
      word_id: s.wordId, word: s.word, is_word_onset: s.isOnset,
      slot: slot.g, row: slot.row,
      beat: slot.pickup ? 0 : slot.beat, subdivision: slot.pickup ? 'pickup' : slot.sub,
      start_ms: +(i * slotSec * 1000).toFixed(2),
      end_ms:   +((i + 1) * slotSec * 1000).toFixed(2)
    });
  });
  return { slotSec: slotSec, entries: tl };
}

/** يجمع نطاقات الكلمات ويقسّمها على صفوف البارات */
function buildWordSegments(flat, grid){
  const byWord = {}, order = [];
  flat.forEach(function(s, i){
    const slot = grid.slots[i];
    if (!slot) return;
    if (!byWord[s.wordId]){ byWord[s.wordId] = []; order.push(s.wordId); }
    byWord[s.wordId].push({ i: i, slot: slot });
  });
  const segs = [];
  order.forEach(function(wid){
    const items = byWord[wid], n = items.length, parts = [];
    let cur = null;
    items.forEach(function(it){
      if (!cur || cur.row !== it.slot.row){
        cur = { wordId: wid, word: flat[it.i].word, n: n, row: it.slot.row,
                colStart: it.slot.col, colEnd: it.slot.col };
        parts.push(cur);
      }
      cur.colEnd = it.slot.col;
    });
    parts.forEach(function(p, k){
      p.openStart = k > 0;
      p.openEnd   = k < parts.length - 1;
      segs.push(p);
    });
  });
  return segs;
}

/* ═══════════════════════════════════════════════════════════════
   §4 — الحالة والعرض (State & Renderer)
   ═══════════════════════════════════════════════════════════════ */
const S = {
  bpm: 90, subdiv: 4, pickup: false, loop: true, playing: false,
  flat: [], words: [], grid: null, timeline: null, segs: [],
  curIdx: -1, curWord: -1
};
const DOM = {
  stage: document.getElementById('stage'),
  warn:  document.getElementById('warn'),
  json:  document.getElementById('json')
};
const cellRefs = { dots: [], strips: [], zones: {}, brks: {} };

function analyze(){
  const res = analyzeLine(document.getElementById('txt').value);
  S.flat  = res.flat;
  S.words = res.words;
  S.grid  = buildGrid(S.flat.length, S.subdiv, S.pickup);
  S.timeline = buildTimeline(S.flat, S.grid, S.bpm, S.subdiv);
  S.segs = buildWordSegments(S.flat, S.grid);

  DOM.warn.classList.toggle('show', res.ambiguous);
  if (res.ambiguous){
    DOM.warn.textContent = 'تنبيه: بعض الحروف غير مُشكَّلة — افتُرضت الفتحة. شكِّل النص بالكامل لضمان دقة التقطيع المطلقة.';
  }
  render();
  updateReadouts();
  updateJSON();
}

function render(){
  DOM.stage.innerHTML = '';
  cellRefs.dots = []; cellRefs.strips = []; cellRefs.zones = {}; cellRefs.brks = {};
  const g = S.grid;

  for (let row = 0; row < g.bars; row++){
    const el = document.createElement('div');
    el.className = 'bar-row';
    el.style.gridTemplateColumns = 'repeat(' + g.cols + ',minmax(44px,1fr))';

    const tag = document.createElement('div');
    tag.className = 'rowtag';
    tag.textContent = 'BAR ' + (row + 1);
    el.appendChild(tag);

    S.segs.filter(function(s){ return s.row === row; }).forEach(function(s){
      const z = document.createElement('div');
      z.className = 'zone';
      z.style.gridColumn = (s.colStart + 1) + ' / ' + (s.colEnd + 2);
      el.appendChild(z);
      (cellRefs.zones[s.wordId] = cellRefs.zones[s.wordId] || []).push(z);

      const b = document.createElement('div');
      b.className = 'brk' + (s.openStart ? ' cont-start' : '') + (s.openEnd ? ' cont-end' : '');
      b.style.gridColumn = (s.colStart + 1) + ' / ' + (s.colEnd + 2);
      if (!s.openStart){
        const n = document.createElement('span');
        n.className = 'brk-n';
        n.textContent = s.n;
        b.appendChild(n);
      }
      el.appendChild(b);
      (cellRefs.brks[s.wordId] = cellRefs.brks[s.wordId] || []).push(b);
    });

    g.slots.filter(function(s){ return s.row === row; }).forEach(function(slot){
      const sylIdx = slot.g;
      const syl = S.flat[sylIdx] || null;

      const dc = document.createElement('div');
      dc.className = 'dotcell';
      dc.style.gridColumn = (slot.col + 1);
      const tri = document.createElement('div');
      tri.className = 'tri' + (syl && syl.isOnset ? '' : ' blank');
      const dot = document.createElement('div');
      dot.className = 'dot' + (syl ? ' hit' : '');
      dc.appendChild(tri); dc.appendChild(dot);
      el.appendChild(dc);
      cellRefs.dots[sylIdx] = dc;

      const st = document.createElement('div');
      st.className = 'striprow' + (syl ? '' : ' empty');
      st.style.gridColumn = (slot.col + 1);
      if (syl){
        const sp = document.createElement('span');
        sp.className = 'syl';
        sp.textContent = syl.text;
        st.appendChild(sp);
        if (!syl.isCoda){
          const hy = document.createElement('span');
          hy.className = 'hy';
          hy.textContent = '\u2013';
          st.appendChild(hy);
        }
      }
      el.appendChild(st);
      cellRefs.strips[sylIdx] = st;

      const c = document.createElement('div');
      c.className = 'cnt' + (slot.pickup ? ' pickup' : (slot.sub === 0 ? ' beat' : ''));
      c.style.gridColumn = (slot.col + 1);
      c.textContent = slot.label;
      el.appendChild(c);
    });

    DOM.stage.appendChild(el);
  }
  paint(-1);
}

function paint(idx){
  cellRefs.dots.forEach(function(d){ if (d) d.classList.remove('on', 'lead'); });
  cellRefs.strips.forEach(function(s){ if (s) s.classList.remove('on', 'inword'); });
  Object.keys(cellRefs.zones).forEach(function(k){
    cellRefs.zones[k].forEach(function(z){ z.classList.remove('speaking', 'queued', 'pulse'); });
  });
  Object.keys(cellRefs.brks).forEach(function(k){
    cellRefs.brks[k].forEach(function(b){ b.classList.remove('speaking'); });
  });

  const cur = (idx >= 0) ? S.flat[idx] : null;
  document.getElementById('rNow').textContent = cur ? cur.word : '\u2014';
  if (!cur){ S.curWord = -1; return; }

  const wid = cur.wordId;
  const changed = wid !== S.curWord;
  S.curWord = wid;

  (cellRefs.zones[wid] || []).forEach(function(z){
    z.classList.add('speaking');
    if (changed){ z.classList.remove('pulse'); void z.offsetWidth; z.classList.add('pulse'); }
  });
  (cellRefs.brks[wid] || []).forEach(function(b){ b.classList.add('speaking'); });

  S.flat.forEach(function(s, i){
    if (s.wordId === wid && cellRefs.strips[i]) cellRefs.strips[i].classList.add('inword');
  });

  let nid = -1, nStart = -1;
  for (let i = idx + 1; i < S.flat.length; i++){
    if (S.flat[i].wordId !== wid){ nid = S.flat[i].wordId; nStart = i; break; }
  }
  if (nid > -1){
    (cellRefs.zones[nid] || []).forEach(function(z){ z.classList.add('queued'); });
    if (cellRefs.dots[nStart]) cellRefs.dots[nStart].classList.add('lead');
  }

  if (cellRefs.dots[idx])   cellRefs.dots[idx].classList.add('on');
  if (cellRefs.strips[idx]) cellRefs.strips[idx].classList.add('on');
}

function updateReadouts(){
  const slotMs = S.timeline.slotSec * 1000;
  document.getElementById('rSyl').textContent   = S.flat.length;
  document.getElementById('rWord').textContent  = S.words.length;
  document.getElementById('rBar').textContent   = S.grid.bars;
  document.getElementById('rSlot').textContent  = slotMs.toFixed(1) + ' ms';
  document.getElementById('rBarMs').textContent = (slotMs * S.grid.perBar).toFixed(0) + ' ms';
}

function updateJSON(){
  DOM.json.textContent = JSON.stringify({
    bpm: S.bpm, subdivision: S.subdiv, slots_per_bar: S.grid.perBar,
    pickup_cell: S.pickup, bars: S.grid.bars,
    slot_duration_ms: +(S.timeline.slotSec * 1000).toFixed(3),
    contract: '1 syllable = 1 slot = 1 pulse',
    words: S.words.map(function(w){ return { id: w.id, text: w.text, syllable_count: w.syls.length }; }),
    syllable_timeline: S.timeline.entries
  }, null, 2);
}

/* ═══════════════════════════════════════════════════════════════
   §5 — النقل: ساعة AudioContext + عارض requestAnimationFrame
   الصوت يُجدول استباقيًا؛ العرض يقرأ الساعة ولا يقودها.
   ═══════════════════════════════════════════════════════════════ */
let ctx = null, startAt = 0, nextSlot = 0, rafId = null, schedId = null;
const LOOKAHEAD = 0.12, TICK = 25;

function ensureCtx(){
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
}

function voice(t, freq, gain, dur){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  o.type = 'square';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.01);
}

function scheduleSlot(i, t){
  const slot = S.grid.slots[i];
  const syl  = S.flat[i];
  if (slot && !slot.pickup && slot.sub === 0) voice(t, 1400, 0.16, 0.05);
  if (syl) voice(t, syl.isOnset ? 1050 : 720, syl.isOnset ? 0.13 : 0.055, 0.045);
}

function scheduler(){
  const total = S.flat.length || 1;
  const horizon = ctx.currentTime + LOOKAHEAD;
  let guard = 0;
  while (startAt + nextSlot * S.timeline.slotSec < horizon && guard++ < 64){
    if (!S.loop && nextSlot >= total) break;
    scheduleSlot(nextSlot % total, startAt + nextSlot * S.timeline.slotSec);
    nextSlot++;
  }
}

function frame(){
  const total = S.flat.length || 1;
  const cycle = total * S.timeline.slotSec;
  const el = ctx.currentTime - startAt;
  if (el >= 0){
    if (!S.loop && el >= cycle){ stop(); paint(-1); return; }
    const pos = S.loop ? (el % cycle) : el;
    const idx = Math.min(total - 1, Math.floor(pos / S.timeline.slotSec));
    if (idx !== S.curIdx){ S.curIdx = idx; paint(idx); }
  }
  rafId = requestAnimationFrame(frame);
}

function play(){
  if (S.playing || !S.flat.length) return;
  ensureCtx();
  S.playing = true; S.curIdx = -1; S.curWord = -1;
  startAt = ctx.currentTime + 0.14;
  nextSlot = 0;
  schedId = setInterval(scheduler, TICK);
  rafId = requestAnimationFrame(frame);
  const b = document.getElementById('play');
  b.textContent = '\u25A0 إيقاف'; b.classList.add('live');
}

function stop(){
  S.playing = false;
  if (schedId) clearInterval(schedId);
  if (rafId) cancelAnimationFrame(rafId);
  schedId = rafId = null;
  S.curIdx = -1; S.curWord = -1;
  paint(-1);
  const b = document.getElementById('play');
  b.textContent = '\u25B6 تشغيل'; b.classList.remove('live');
}

/* ═══════════════════════════════════════════════════════════════
   §6 — الربط
   ═══════════════════════════════════════════════════════════════ */
document.getElementById('bpm').addEventListener('input', function(e){
  S.bpm = parseInt(e.target.value, 10);
  document.getElementById('bpmVal').textContent = S.bpm;
  const wasPlaying = S.playing;
  if (wasPlaying) stop();
  analyze();
  if (wasPlaying) play();
});
document.getElementById('subdiv').addEventListener('change', function(e){
  S.subdiv = parseInt(e.target.value, 10);
  if (S.playing) stop();
  analyze();
});
document.getElementById('pickup').addEventListener('change', function(e){
  S.pickup = e.target.checked;
  if (S.playing) stop();
  analyze();
});
document.getElementById('loop').addEventListener('change', function(e){ S.loop = e.target.checked; });
document.getElementById('txt').addEventListener('input', function(){
  if (S.playing) stop();
  analyze();
});
document.getElementById('play').addEventListener('click', function(){ S.playing ? stop() : play(); });
document.getElementById('jsonBtn').addEventListener('click', function(){ DOM.json.classList.toggle('show'); });

analyze();
</script>
